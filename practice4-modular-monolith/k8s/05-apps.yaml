# ==========================================
# 1. USERS SERVICE
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: users-service
  namespace: saga-system
spec:
  ports:
    - port: 8080
      targetPort: 8080
  selector:
    app: users-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-service
  namespace: saga-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users-service
  template:
    metadata:
      labels:
        app: users-service
    spec:
      containers:
        - name: app
          image: anna13nechytailenko/saga-users:v1.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: COMMIT_HASH
              value: "{{COMMIT_HASH}}"
          envFrom:
            - configMapRef:
                name: app-config

