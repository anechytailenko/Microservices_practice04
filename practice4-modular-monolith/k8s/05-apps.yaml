# ==========================================
# 5. API GATEWAY
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: gateway-service
  namespace: saga-system
spec:
  type: NodePort
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  selector:
    app: gateway
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: saga-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gateway
  template:
    metadata:
      labels:
        app: gateway
    spec:
      containers:
        - name: app
          image: anna13nechytailenko/saga-gateway:v1.1
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: COMMIT_HASH
              value: "{{COMMIT_HASH}}"
          envFrom:
            - configMapRef:
                name: app-config