---
# ==========================================
# 1. USERS DB
# ==========================================
apiVersion: v1
kind: Service
metadata:
  name: users-db
  namespace: saga-system
spec:
  ports:
    - port: 5432
  selector:
    app: users-db
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: users-db
  namespace: saga-system
spec:
  serviceName: users-db
  replicas: 1
  selector:
    matchLabels:
      app: users-db
  template:
    metadata:
      labels:
        app: users-db
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "user_user"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: "users_db"

