# ==========================================
# 1. USERS MIGRATION JOB
# ==========================================
apiVersion: batch/v1
kind: Job
metadata:
  name: users-migration-job
  namespace: saga-system
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: users-migrator
          image: anna13nechytailenko/saga-users:v1.1
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: app-config

---
