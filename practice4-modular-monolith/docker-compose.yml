version: '3.8'

services:
  # ==========================================
  # MESSAGE BROKER
  # ==========================================
  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:${RABBITMQ_PORT}"
      - "${RABBITMQ_UI_PORT}:${RABBITMQ_UI_PORT}"
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 5s
      timeout: 5s
      retries: 5

  # ==========================================
  # DATABASES
  # ==========================================
  users-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${USERS_DB_USER}
      POSTGRES_PASSWORD: ${USERS_DB_PASSWORD}
      POSTGRES_DB: ${USERS_DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${USERS_DB_USER} -d ${USERS_DB_NAME}" ]
      interval: 2s
      timeout: 5s
      retries: 10

  meetups-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${MEETUPS_DB_USER}
      POSTGRES_PASSWORD: ${MEETUPS_DB_PASSWORD}
      POSTGRES_DB: ${MEETUPS_DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${MEETUPS_DB_USER} -d ${MEETUPS_DB_NAME}" ]
      interval: 2s
      timeout: 5s
      retries: 10

  notification-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${NOTIF_DB_USER}
      POSTGRES_PASSWORD: ${NOTIF_DB_PASSWORD}
      POSTGRES_DB: ${NOTIF_DB_NAME}
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${NOTIF_DB_USER} -d ${NOTIF_DB_NAME}" ]
      interval: 2s
      timeout: 5s
      retries: 10

  # ==========================================
  # MIGRATORS
  # ==========================================
  users-migrate:
    image: migrate/migrate:v4.17.0
    volumes:
      - ./migrations/users:/migrations
    command: -path /migrations -database postgres://${USERS_DB_USER}:${USERS_DB_PASSWORD}@users-db:${POSTGRES_PORT}/${USERS_DB_NAME}?sslmode=disable up
    depends_on:
      users-db:
        condition: service_healthy

  meetups-migrate:
    image: migrate/migrate:v4.17.0
    volumes:
      - ./migrations/meetups:/migrations
    command: -path /migrations -database postgres://${MEETUPS_DB_USER}:${MEETUPS_DB_PASSWORD}@meetups-db:${POSTGRES_PORT}/${MEETUPS_DB_NAME}?sslmode=disable up
    depends_on:
      meetups-db:
        condition: service_healthy

  notification-migrate:
    image: migrate/migrate:v4.17.0
    volumes:
      - ./migrations/notifications:/migrations
    command: -path /migrations -database postgres://${NOTIF_DB_USER}:${NOTIF_DB_PASSWORD}@notification-db:${POSTGRES_PORT}/${NOTIF_DB_NAME}?sslmode=disable up
    depends_on:
      notification-db:
        condition: service_healthy

  # ==========================================
  # SERVICES
  # ==========================================
  users-service:
    build:
      context: .
      dockerfile: deploy/users.Dockerfile
      args:
        - COMMIT_HASH=${COMMIT_HASH:-unknown}
    environment:
      - PORT=${SERVICE_PORT}
      - USERS_DB_URL=postgres://${USERS_DB_USER}:${USERS_DB_PASSWORD}@users-db:${POSTGRES_PORT}/${USERS_DB_NAME}?sslmode=disable
    depends_on:
      users-migrate:
        condition: service_completed_successfully

  meetups-service:
    build:
      context: .
      dockerfile: deploy/meetups.Dockerfile
      args:
        - COMMIT_HASH=${COMMIT_HASH:-unknown}
    environment:
      - PORT=${SERVICE_PORT}
      - MEETUPS_DB_URL=postgres://${MEETUPS_DB_USER}:${MEETUPS_DB_PASSWORD}@meetups-db:${POSTGRES_PORT}/${MEETUPS_DB_NAME}?sslmode=disable
      - USERS_SERVICE_URL=http://users-service:${SERVICE_PORT}
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}/
    depends_on:
      users-service:
        condition: service_started
      meetups-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: deploy/notifications.Dockerfile
      args:
        - COMMIT_HASH=${COMMIT_HASH:-unknown}
    environment:
      - PORT=${SERVICE_PORT}
      - NOTIFICATION_DB_URL=postgres://${NOTIF_DB_USER}:${NOTIF_DB_PASSWORD}@notification-db:${POSTGRES_PORT}/${NOTIF_DB_NAME}?sslmode=disable
      - RABBITMQ_URL=amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:${RABBITMQ_PORT}/
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  # ==========================================
  # API GATEWAY
  # ==========================================
  gateway:
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
      args:
        - COMMIT_HASH=${COMMIT_HASH:-unknown}
    ports:
      - "${SERVICE_PORT}:${SERVICE_PORT}"
    environment:
      - PORT=${SERVICE_PORT}
      - MEETUPS_SERVICE_URL=http://meetups-service:${SERVICE_PORT}
      - USERS_SERVICE_URL=http://users-service:${SERVICE_PORT}
    depends_on:
      - meetups-service
      - users-service
