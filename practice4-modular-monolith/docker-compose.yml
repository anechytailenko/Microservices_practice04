version: '3.8'

services:
  # ==========================================
  # DATABASES
  # ==========================================
  meetups-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: meetup_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: meetups_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U meetup_user -d meetups_db" ]
      interval: 2s
      timeout: 5s
      retries: 10

  users-db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: users_db
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user_user -d users_db" ]
      interval: 2s
      timeout: 5s
      retries: 10

  # ==========================================
  # MIGRATORS
  # ==========================================
  users-migrate:
    image: migrate/migrate:v4.17.0
    volumes:
      - ./migrations/users:/migrations
    command: -path /migrations -database postgres://user_user:secret_password@users-db:5432/users_db?sslmode=disable up
    depends_on:
      users-db:
        condition: service_healthy

  meetups-migrate:
    image: migrate/migrate:v4.17.0
    volumes:
      - ./migrations/meetups:/migrations
    command: -path /migrations -database postgres://meetup_user:secret_password@meetups-db:5432/meetups_db?sslmode=disable up
    depends_on:
      meetups-db:
        condition: service_healthy

  # ==========================================
  # SERVICES
  # ==========================================
  users-service:
    build:
      context: .
      dockerfile: deploy/users.Dockerfile
      args:
        - COMMIT_HASH=${COMMIT_HASH:-unknown}
    environment:
      - PORT=8080
      - USERS_DB_URL=postgres://user_user:secret_password@users-db:5432/users_db?sslmode=disable
    depends_on:
      users-migrate:
        condition: service_completed_successfully

  meetups-service:
    build:
      context: .
      dockerfile: deploy/meetups.Dockerfile
      args:
        - COMMIT_HASH=${COMMIT_HASH:-unknown}
    environment:
      - PORT=8080
      - MEETUPS_DB_URL=postgres://meetup_user:secret_password@meetups-db:5432/meetups_db?sslmode=disable
      - USERS_SERVICE_URL=http://users-service:8080
    depends_on:
      users-service:
        condition: service_started
      meetups-migrate:
        condition: service_completed_successfully

  # ==========================================
  # API GATEWAY
  # ==========================================
  gateway:
    build:
      context: .
      dockerfile: deploy/gateway.Dockerfile
      args:
        - COMMIT_HASH=${COMMIT_HASH:-unknown}
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - MEETUPS_SERVICE_URL=http://meetups-service:8080
      - USERS_SERVICE_URL=http://users-service:8080
    depends_on:
      - meetups-service
      - users-service
